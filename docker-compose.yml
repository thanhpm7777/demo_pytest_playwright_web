version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-service
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 2s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ui-tests
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./videos:/app/videos
    # No CMD here, so we can override when run
