name: ui-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print BASE_URL
        run: echo "BASE_URL=${{ secrets.BASE_URL }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      - name: Build test image (and load to daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ui-tests:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Kết nối trực tiếp tới VPS MySQL (không dùng services)
      - name: Run tests (Docker)
        run: |
          mkdir -p allure-results screenshots videos test-results
          docker run --rm \
            -e BASE_URL='${{ secrets.BASE_URL }}' \
            -e USER_EMAIL='${{ secrets.USER_EMAIL }}' \
            -e USER_PASSWORD='${{ secrets.USER_PASSWORD }}' \
            -e PW_HEADLESS='true' \
            -e PW_BROWSER='chromium' \
            -e PW_TIMEOUT='10000' \
            -e RECORD_VIDEO='false' \
            -e MYSQL_HOST='${{ secrets.MYSQL_HOST }}' \
            -e MYSQL_PORT='${{ secrets.MYSQL_PORT }}' \
            -e MYSQL_USER='${{ secrets.MYSQL_USER }}' \
            -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD }}' \
            -e MYSQL_DB='${{ secrets.MYSQL_DB }}' \
            -v "$PWD/allure-results:/app/allure-results" \
            -v "$PWD/test-results:/app/test-results" \
            -v "$PWD/screenshots:/app/screenshots" \
            -v "$PWD/videos:/app/videos" \
            ui-tests:ci

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            screenshots/
            videos/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Setup Java (for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: npm i -g allure-commandline@2.24.1

      - name: Generate Allure HTML report
        run: |
          ls -l allure-results || true
          allure generate allure-results -o allure-report --clean
          echo "# Test Report" > allure-report/README.md
          echo "Generated: $(date -u)" >> allure-report/README.md
          echo "Workflow: ${{ github.workflow }}" >> allure-report/README.md
          echo "Run ID: ${{ github.run_id }}" >> allure-report/README.md

      - name: Upload Allure HTML (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report
          if-no-files-found: error
          retention-days: 30

  notify:
    needs: [test, report]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Summary (tests failed)
        if: needs.test.result == 'failure'
        run: |
          echo "::error title=E2E Tests Failed::Tests failed on main. Download 'allure-report-html' artifact in this run to view the report."
      - name: Summary (tests passed)
        if: needs.test.result == 'success'
        run: |
          echo "::notice title=E2E Tests Passed::All tests passed. Download 'allure-report-html' artifact in this run to view the report."

  docker:
    name: Build & Push Docker image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.result == 'success' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ui-tests
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
