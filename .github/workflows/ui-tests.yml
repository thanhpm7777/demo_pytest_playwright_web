name: ui-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 5"   # 09:00 thứ 6 (UTC+7)

permissions:
  contents: read
  packages: write   # nếu bạn muốn push image lên GHCR ở job "docker" phía dưới

concurrency:
  group: ci-web-e2e-${{ github.ref }}e
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest

      # Build image từ Dockerfile (không push)
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ui-tests:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chạy tests bên trong container
      # Lưu ý: dùng --network host để container truy cập service MySQL qua 127.0.0.1:3306
      - name: Run tests (Docker)
        run: |
          mkdir -p allure-results screenshots videos
          docker run --rm \
            --network host \
            -e BASE_URL='${{ secrets.BASE_URL }}' \
            -e USER_EMAIL='${{ secrets.USER_EMAIL }}' \
            -e USER_PASSWORD='${{ secrets.USER_PASSWORD }}' \
            -e MYSQL_HOST='127.0.0.1' \
            -e MYSQL_PORT='3306' \
            -e MYSQL_USER='appuser' \
            -e MYSQL_PASSWORD='apppass' \
            -e MYSQL_DB='appdb' \
            -v "$PWD/allure-results:/app/allure-results" \
            -v "$PWD/screenshots:/app/screenshots" \
            -v "$PWD/videos:/app/videos" \
            ui-tests:ci

      - name: Upload Allure results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Setup Java (for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: npm i -g allure-commandline@2.24.1

      - name: Generate Allure HTML report
        run: |
          ls -l allure-results || true
          allure generate allure-results -o allure-report --clean
          echo "# Test Report" > allure-report/README.md
          echo "Generated: $(date -u)" >> allure-report/README.md
          echo "Workflow: ${{ github.workflow }}" >> allure-report/README.md
          echo "Run ID: ${{ github.run_id }}" >> allure-report/README.md

      - name: Upload Allure HTML (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report
          if-no-files-found: error
          retention-days: 30

  notify:
    needs: [test, report]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Summary (tests failed)
        if: needs.test.result == 'failure'
        run: |
          echo "::error title=E2E Tests Failed::Tests failed on main. Download 'allure-report-html' artifact in this run to view the report."
      - name: Summary (tests passed)
        if: needs.test.result == 'success'
        run: |
          echo "::notice title=E2E Tests Passed::All tests passed. Download 'allure-report-html' artifact in this run to view the report."

  # (Tuỳ chọn) Build & Push image lên GHCR sau khi test PASS trên main
  docker:
    name: Build & Push Docker image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.result == 'success' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ui-tests
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
