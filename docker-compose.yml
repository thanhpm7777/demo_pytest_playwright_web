version: '3.9'

services:
  mysql:
    image: mysql:8.0
    # container_name: mysql-service    # bỏ đi nếu không cần đặt cố định
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"   # port host 3307 -> container 3306 (tuỳ bạn muốn map hay không)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: ui-tests      # optional
    env_file: .env                 # bạn có thể dùng .env để lưu credentials / settings
    depends_on:
      - mysql
    volumes:
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./videos:/app/videos
      - ./wait-and-run.sh:/app/wait-and-run.sh   # mount script (hoặc COPY vào image)
    entrypoint: ["/bin/bash", "-c"]
    command: >
      /app/wait-and-run.sh
    # Nếu bạn muốn override command khi docker-compose run, có thể dùng `docker-compose run tests sh`

volumes:
  mysql-data:
